[package]
name = "ftlpad"
version = "1.0.0"
edition = "2021"
authors = ["Maxim Gorin"]
description = "Gamepad layer for FTL: Faster Than Light"
repository = "https://github.com/mxmgorin/ftlpad"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
libc = "0.2"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
panic = "abort"
strip = true
