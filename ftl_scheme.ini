# FTL scheme for any pad: the D-pad walks the zones on screen and the sticks flick the
# magnet; L3, R3 or a Select tap turn them all into a free cursor. Inputs a pad lacks
# never fire, so one file serves two, one and no sticks. Held shoulders and X open wheels picked with either stick:
# A acts, B closes, D-pad up and down add and take power, letting go closes. Taps on the same buttons do the
# quick things. Face buttons are named by their labels (PortMaster convention).
# A plate may name its icon after the label: a game image path under img/, with
# @X,Y,W,H for a region of it in pixels.
[config]

[controls]
overlay = clear

a = context_click         # click, drag while held, act in a wheel
b = wheel abilities | cancel   # tap: cancel aim, close a wheel, back out of a screen
x = wheel weapons | arm_next   # tap: arm the next weapon
y = wheel crew | aim_crew       # tap: next crew member; on a ship screen: next tab
l1 = wheel systems | prev_tab   # tap on a ship screen: previous tab
r1 = wheel ship | next_tab      # tap on a ship screen: next tab
l2 = precision | room_doors   # held: doors become the zones; tap: all doors of the room under the cursor
r2 = fast_forward | j     # tap: FTL jump; held: run fast
l3 = dpad_mode            # D-pad and sticks: zones and flicks, or a free cursor
r3 = dpad_mode            # the same toggle on either stick
start = help | pause      # tap: pause; held: controls list
back = esc | dpad_mode    # tap: cursor or zones; held: game menu

left_analog = mouse_movement
right_analog = flick

[wheel:weapons]
kind = power
up = 1 "Weapon 1"
up_right = 2 "Weapon 2"
right = 3 "Weapon 3"
down_right = 4 "Weapon 4"
down = v "Autofire" misc/crosshairs_placed.png
down_left = 5 "Drone 1"
left = 6 "Drone 2"
up_left = 7 "Drone 3"

[wheel:systems]
kind = systems

[wheel:crew]
kind = crew

[wheel:ship]
kind = action
up = u "Upgrades" statusUI/top_ship_off.png
up_right = z "Open doors" systemUI/button_door_bottom_off.png@10,33,20,20
right = x "Close doors" systemUI/button_door_top_off.png@10,10,20,20
down = q "All crew" upgradeUI/Equipment/tabButtons/equipment_crew_off.png@49,12,29,29
left = / "Save stations" statusUI/button_station_assign_off.png
up_left = enter "To stations" statusUI/button_station_return_off.png

[wheel:abilities]
kind = action
up = c "Cloak" icons/s_cloaking_overlay.png
up_right = b "Battery" icons/s_battery_overlay.png
right = n "Hacking" icons/s_hacking_overlay.png
down_right = m "Mind control" icons/s_mind_overlay.png
down = t "Teleport" mouse/mouse_teleport_out1.png
down_left = r "Teleport back" mouse/mouse_teleport_in1.png
left = y "Artillery" icons/s_artillery_overlay.png
up_left = p "Lockdown" icons/locking/s_lock.png

