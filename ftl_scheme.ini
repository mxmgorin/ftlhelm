# FTL scheme: the left stick is the cursor, the right stick flicks the magnet, the D-pad
# walks the zones on screen. Held shoulders and X open wheels picked with either stick:
# A acts, B closes, D-pad up and down add and take power, letting go closes. Taps on the same buttons do the
# quick things. Face buttons are named by their labels (PortMaster convention).
[config]

[controls]
overlay = clear

a = context_click         # click, drag while held, act in a wheel
b = cancel                # cancel aim, close a wheel, back out of a screen
x = wheel abilities
y = wheel ship
l1 = wheel weapons | arm_next
r1 = wheel crew | aim_crew
l2 = wheel systems | prev_tab
r2 = precision | next_tab  # held: doors become the zones, D-pad picks the wall, A toggles
l3 = wheel settings | help  # tap: controls list on screen
r3 = center_swap          # cursor to the other ship
start = pause
back = fast_forward | esc  # tap: game menu, close a window; held: run fast

left_analog = mouse_movement
right_analog = flick

[wheel:weapons]
kind = power
up = 1 "Weapon 1"
up_right = 2 "Weapon 2"
right = 3 "Weapon 3"
down_right = 4 "Weapon 4"
down = v "Autofire"
down_left = 5 "Drone 1"
left = 6 "Drone 2"
up_left = 7 "Drone 3"

[wheel:systems]
kind = systems

[wheel:crew]
kind = crew

[wheel:ship]
kind = action
up = z "Open doors"
up_right = q "All crew"
right = j "Jump"
down_right = enter "To stations"
down = x "Close doors"
down_left = / "Save stations"
left = u "Upgrades"
up_left = room_doors "Room doors"

[wheel:abilities]
kind = action
up = c "Cloak"
up_right = b "Battery"
right = n "Hacking"
down_right = m "Mind control"
down = t "Teleport"
down_left = r "Teleport back"
left = y "Artillery"
up_left = p "Lockdown"

[wheel:settings]
kind = settings
up = precision "Doors mode"
