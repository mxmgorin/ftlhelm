# ftlpad settings, re-read while the game runs.

# Cursor speed at full stick deflection, in the game's 1280x720 pixels per second.
cursor_speed = 800
# Stick travel ignored around the centre, 0 to 0.9; raise it when the cursor drifts.
cursor_deadzone = 0.25
# Response curve exponent, 0.5 to 4: 1 is linear, higher is finer near the centre.
cursor_curve = 2
# 1 shows the mode badge in the top right corner, 0 hides it.
overlay = 1
# 1 lets the D-pad jump between rooms while a weapon waits for a target or crew is selected.
snap_dpad = 1
# 1 pauses the game while a wheel is open and unpauses what the wheel paused.
autopause_wheel = 1
# 1 pauses the game when a weapon or ability starts waiting for a target.
autopause_aim = 0
# Game speed level while fast forward is held, 1 to 6; the engine scales each step by (16 + 7 * level) / 16.
speed_level = 3
# 1 pulses the pad when the magnet lands or a wheel plate changes.
rumble = 1
# Face buttons by label: -1 takes PortMaster's SDL mapping for the device and the swaps
# below when there is none, 1 forces the swaps, 0 forces none.
nintendo_labels = -1
# Which raw pairs the labels swap: A with B, X with Y. The Smart Pro S swaps only A and B.
swap_ab = 1
swap_xy = 0
# Stick deflection that fires a flick, 0.35 to 1; the stick re-arms below 0.25.
flick_threshold = 0.8
# Seconds between repeated flicks while the stick stays deflected; 0 means one flick
# per deflection.
flick_repeat = 0
