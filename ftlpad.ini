# ftlpad settings, re-read while the game runs.

# Cursor speed at full stick deflection, in the game's 1280x720 pixels per second.
cursor_speed = 800
# Stick travel ignored around the centre, 0 to 0.9; raise it when the cursor drifts.
cursor_deadzone = 0.25
# Response curve exponent, 0.5 to 4: 1 is linear, higher is finer near the centre.
cursor_curve = 2
# 1 draws the box around the cursor, 0 hides it.
overlay = 1
# 1 lets the D-pad jump between rooms while a weapon waits for a target or crew is selected.
snap_dpad = 1
# 1 pauses the game while a wheel is open and unpauses what the wheel paused.
autopause_wheel = 1
# 1 pauses the game when a weapon or ability starts waiting for a target.
autopause_aim = 0
# Game speed level while Y is held, 1 to 6; the engine scales each step by (16 + 7 * level) / 16.
speed_level = 3
# 1 pulses the pad when the magnet lands or a wheel plate changes.
rumble = 1
# Face buttons by label: -1 takes PortMaster's SDL mapping for the device (Nintendo-style
# when there is none), 1 forces Nintendo-style labels (A right, B bottom, X top, Y left),
# 0 Xbox-style.
nintendo_labels = -1
