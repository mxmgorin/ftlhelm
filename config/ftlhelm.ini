# ftlhelm layout: https://github.com/mxmgorin/ftlhelm/blob/main/docs/CONFIGURATION.md
# Deleting this file resets it to the defaults.

[config]
cursor_speed = 800
cursor_deadzone = 0.25
cursor_curve = 2

snap_dpad = 1
flick_threshold = 0.8
flick_repeat = 0
focus_cone_narrow = 30
focus_cone_wide = 60
focus_side_weight = 2
focus_first = 1
crew_follow = 0

wheels_ship_only = 1
autopause_wheel = 1
autopause_aim = 0
speed_level = 6

tap_hold = 0.2
rumble = 1
rumble_strength = 0.4
rumble_time = 0.05
swap_ab = 0
swap_xy = 0

overlay = 1
zoom = 0
text_scale = 0

[controls]
overlay = clear

a = context_click
b = wheel abilities | cancel
x = wheel weapons | arm_next
y = wheel crew | aim_crew
l1 = wheel systems | prev_tab
r1 = wheel ship | next_tab
l2 = precision | room_doors
r2 = fast_forward | j
l3 = dpad_mode
r3 = dpad_mode
start = pause
back = esc | wheel settings

left_analog = flick
right_analog = flick

[wheel:weapons]
kind = power
up = 1 "Weapon 1"
up_right = 2 "Weapon 2"
right = 3 "Weapon 3"
down_right = 4 "Weapon 4"
down = v "Autofire" misc/crosshairs_placed.png
down_left = 5 "Drone 1"
left = 6 "Drone 2"
up_left = 7 "Drone 3"

[wheel:systems]
kind = systems

[wheel:crew]
kind = crew

[wheel:ship]
kind = action
up = u "Upgrades" statusUI/top_ship_off.png
up_right = z "Open doors" systemUI/button_door_bottom_off.png@10,33,20,20
right = x "Close doors" systemUI/button_door_top_off.png@10,10,20,20
down = q "All crew" upgradeUI/Equipment/tabButtons/equipment_crew_off.png@49,12,29,29
left = / "Save stations" statusUI/button_station_assign_off.png
up_left = enter "To stations" statusUI/button_station_return_off.png

[wheel:settings]
kind = settings
up = dpad_mode "Mouse"
right = zoom "Zoom"
left = text_size "Text"
down = help "Help"

[wheel:abilities]
kind = action
up = c "Cloak" icons/s_cloaking_overlay.png
up_right = n "Hacking" icons/s_hacking_overlay.png
right = t "Teleport" systemUI/button_teleport_top_on.png@4,4,32,32
down_right = p "Lockdown" icons/locking/s_lock.png
down = b "Battery" icons/s_battery_overlay.png
down_left = y "Artillery" icons/s_artillery_overlay.png
left = r "Teleport back" systemUI/button_teleport_bottom_on.png@4,27,32,32
up_left = m "Mind control" icons/s_mind_overlay.png
