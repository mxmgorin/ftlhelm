# FTL scheme for any pad: the D-pad walks the zones on screen and the sticks flick the
# magnet; L3, R3 or a Select tap turn them all into a free cursor. Inputs a pad lacks
# never fire, so one file serves two, one and no sticks. Holding B, X, Y, L1 or R1 opens
# a wheel, picked with either stick: A acts, D-pad up and down add and take power, B or
# the same button closes it. Taps on those buttons do the quick things. Face buttons
# are named by their labels (PortMaster convention).
# A plate may name its icon after the label: a game image path under img/, with
# @X,Y,W,H for a region of it in pixels.
[config]
# Cursor speed at full stick deflection, in the game's 1280x720 pixels per second.
cursor_speed = 800
# Stick travel ignored around the centre, 0 to 0.9; raise it when the cursor drifts.
cursor_deadzone = 0.25
# Response curve exponent, 0.5 to 4: 1 is linear, higher is finer near the centre.
cursor_curve = 2
# 1 shows the mode badge in the top right corner, 0 hides it.
overlay = 1
# 1 makes the D-pad jump between zones unless it moves the cursor or a hold_state page is
# held; 0 leaves the D-pad to the layout.
snap_dpad = 1
# 1 pauses the game while a wheel is open and unpauses what the wheel paused.
autopause_wheel = 1
# 1 pauses the game when a weapon or ability starts waiting for a target.
autopause_aim = 0
# Game speed level while fast forward is held, 1 to 6; the engine scales each step by (16 + 7 * level) / 16.
speed_level = 5
# 1 pulses the pad when the magnet lands or a wheel plate changes.
rumble = 1
# Face buttons follow PortMaster's SDL mapping for the device. Without one, these swap
# raw pairs to match the labels: A with B, X with Y. The Smart Pro S swaps only A and B.
swap_ab = 1
swap_xy = 0
# Stick deflection that fires a flick, 0.35 to 1; the stick re-arms below 0.25.
flick_threshold = 0.8
# Seconds between repeated flicks while the stick stays deflected; 0 means one flick
# per deflection.
flick_repeat = 0
# Seconds a press must last to count as a hold on a button with a tap action, 0.05 to 2.
tap_hold = 0.2
# D-pad zone search: half-angles in degrees of the narrow cone tried first and the wide
# one tried next, 5 to 89, and how many times sideways distance counts over forward, 0 to 10.
focus_cone_narrow = 30
focus_cone_wide = 60
focus_side_weight = 2
# 1 puts the cursor on the first item when a menu, a dialog or the map opens.
focus_first = 1
# 1 moves the cursor to the room of a newly selected crew member.
crew_follow = 1
# 1 opens wheels only on the ship view; 0 opens them over menus, screens and the map too.
wheels_ship_only = 1
# Pad pulse strength, 0 to 1, and length in seconds, 0.01 to 0.5.
rumble_strength = 0.4
rumble_time = 0.05

[controls]
overlay = clear

a = context_click         # click, drag while held, act in a wheel
b = wheel abilities | cancel   # tap: cancel aim, close a wheel, back out of a screen
x = wheel weapons | arm_next   # tap: arm the next weapon
y = wheel crew | aim_crew       # tap: next crew member; on a ship screen: next tab
l1 = wheel systems | prev_tab   # tap on a ship screen: previous tab
r1 = wheel ship | next_tab      # tap on a ship screen: next tab
l2 = precision | room_doors   # held: doors become the zones; tap: all doors of the room under the cursor
r2 = fast_forward | j     # tap: FTL jump; held: run fast
l3 = dpad_mode            # D-pad and sticks: zones and flicks, or a free cursor
r3 = dpad_mode            # the same toggle on either stick
start = help | pause      # tap: pause; held: controls list
back = esc | dpad_mode    # tap: cursor or zones; held: game menu

left_analog = mouse_movement
right_analog = flick

[wheel:weapons]
kind = power
up = 1 "Weapon 1"
up_right = 2 "Weapon 2"
right = 3 "Weapon 3"
down_right = 4 "Weapon 4"
down = v "Autofire" misc/crosshairs_placed.png
down_left = 5 "Drone 1"
left = 6 "Drone 2"
up_left = 7 "Drone 3"

[wheel:systems]
kind = systems

[wheel:crew]
kind = crew

[wheel:ship]
kind = action
up = u "Upgrades" statusUI/top_ship_off.png
up_right = z "Open doors" systemUI/button_door_bottom_off.png@10,33,20,20
right = x "Close doors" systemUI/button_door_top_off.png@10,10,20,20
down = q "All crew" upgradeUI/Equipment/tabButtons/equipment_crew_off.png@49,12,29,29
left = / "Save stations" statusUI/button_station_assign_off.png
up_left = enter "To stations" statusUI/button_station_return_off.png

[wheel:abilities]
kind = action
up = c "Cloak" icons/s_cloaking_overlay.png
up_right = n "Hacking" icons/s_hacking_overlay.png
right = t "Teleport" systemUI/button_teleport_top_on.png@4,4,32,32
down_right = p "Lockdown" icons/locking/s_lock.png
down = b "Battery" icons/s_battery_overlay.png
down_left = y "Artillery" icons/s_artillery_overlay.png
left = r "Teleport back" systemUI/button_teleport_bottom_on.png@4,27,32,32
up_left = m "Mind control" icons/s_mind_overlay.png

